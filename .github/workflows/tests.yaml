# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Run Tests

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  tests:
    # Hosted macOS minutes are expensive, so feature branches do not get a
    # cloud run. Everything is verified locally first; CI is the gate on the
    # promotion branches only.
    if: github.head_ref == 'staging' || github.head_ref == 'main'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: xcodebuild build-for-testing -scheme MLXAudio-Package -destination 'platform=macOS' -skipPackagePluginValidation MACOSX_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO
      - name: Run tests
        run: xcodebuild test-without-building -scheme MLXAudio-Package -destination 'platform=macOS' -skipPackagePluginValidation -skip-testing:'MLXAudioTests/SmokeTests' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
